# Inboundr backend behind Cloudflare (proxied) on the Oracle VM.
# Install: see deploy/08-backend-on-oracle-vm.md (step 4).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which uses the `http2` listen flag.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Real visitor IP from Cloudflare (file generated during setup).
    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # Email webhooks accept up to 10 MB; large files go browser -> R2 directly.
    client_max_body_size 25m;

    # Support chat and notification WebSockets.
    location ~ ^/api/v1/(support|notifications)/ws$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Stream AI chat responses instead of buffering them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
